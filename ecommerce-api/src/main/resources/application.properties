spring.application.name=ecommerce-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health,info
#This tells Actuator to include health-component details in the response.
# Since we'll only use this setting for local development, it's acceptable here;
# don't expose unrestricted health details publicly in production.
management.endpoint.health.show-details=always